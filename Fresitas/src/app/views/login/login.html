
<div class="login-container">
  <mat-card class="login-card">

    <mat-card-header>
      <mat-card-title>Iniciar sesión</mat-card-title>
      <mat-card-subtitle>Fresitas</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>

      <form [formGroup]="form" (ngSubmit)="iniciarSesion()">

        <!-- Usuario -->
        <mat-form-field appearance="outline" class="campo-completo">
          <mat-label>Correo electrónico</mat-label>
        <input
        matInput
        type="email"
        formControlName="usuario"
        placeholder="ejemplo@correo.com"
        />
          <mat-icon matSuffix>person</mat-icon>

          <mat-error *ngIf="form.get('usuario')?.hasError('required')">
            El usuario es obligatorio
          </mat-error>

          <mat-error *ngIf="form.get('usuario')?.hasError('minlength')">
            El usuario debe tener mínimo 8 caracteres
          </mat-error>
        </mat-form-field>

        <!-- Contraseña -->
        <mat-form-field appearance="outline" class="campo-completo">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            [type]="ocultar ? 'password' : 'text'"
            formControlName="contraseña"
            placeholder="Contraseña"
          />

          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="ocultar = !ocultar"
          >
            <mat-icon>
              {{ ocultar ? 'visibility_off' : 'visibility' }}
            </mat-icon>
          </button>

          <mat-error *ngIf="form.get('contraseña')?.hasError('required')">
            La contraseña es obligatoria
          </mat-error>

          <mat-error *ngIf="form.get('contraseña')?.hasError('minlength')">
            La contraseña debe tener mínimo 8 caracteres
          </mat-error>
        </mat-form-field>

        <!-- Botón -->
        <button
          mat-raised-button
          color="primary"
          class="btn-login"
          type="submit"
        >
          Ingresar
        </button>

      </form>

    </mat-card-content>
  </mat-card>
</div>
